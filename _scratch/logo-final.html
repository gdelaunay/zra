<!doctype html><meta charset="utf-8"><title>ZRA — G final</title>
<style>
body{margin:0;padding:32px;font:14px system-ui;background:#1d2021;color:#ebdbb2}
h2{font-weight:500;margin:32px 0 12px;color:#a89984}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:#282828;border-radius:12px;padding:16px}
.card b{display:block;margin-bottom:4px}.card p{color:#a89984;margin:4px 0 0;line-height:1.4}
.row{display:flex;gap:12px;align-items:end;margin-top:12px}
.d,.l{border-radius:8px;display:flex;align-items:center;justify-content:center;padding:8px}
.d{background:#1d2021;--n:#ebdbb2;--a:#b8bb26;--bg:#1d2021}
.l{background:#fbf1c7;--n:#282828;--a:#98971a;--bg:#fbf1c7}
svg{display:block}
.tag{font-size:12px;color:#a89984;margin:12px 0 -6px}
</style>
<svg width="0" height="0" style="position:absolute"><defs>
<!-- G, marge divisée par deux : cadre 68..444 (au lieu de 136..376), pattes 125, pointes t=152.
     Le trait se règle via --w sur le conteneur. -->
<symbol id="bi" viewBox="0 0 512 512"><g fill="none" style="stroke-width:var(--w,68)" stroke-linecap="round" stroke-linejoin="round"><path stroke="var(--n)" d="M68 193 V68 H444 L292 220"/><path stroke="var(--a)" d="M444 319 V444 H68 L220 292"/></g></symbol>
<symbol id="mo" viewBox="0 0 512 512"><g fill="none" style="stroke-width:var(--w,68)" stroke-linecap="round" stroke-linejoin="round"><path stroke="var(--n)" d="M68 193 V68 H444 L292 220"/><path stroke="var(--n)" d="M444 319 V444 H68 L220 292"/></g></symbol>
</defs></svg>

<h2>G — taille du trait (marge ÷ 2)</h2><div class="grid" id="g1"></div>
<script>
const L = [
  [56,'A. Trait 56','Fin : vide entre les moitiés ~46, le Z respire, plus proche du trait fin de Zed. Perd un peu de densité en 16 px.'],
  [68,'B. Trait 68','Le G retenu, à proportions identiques (44 × 1,57) : vide ~34. L’équilibre actuel, simplement agrandi.'],
  [80,'C. Trait 80','Gras : vide ~22, plus dense et solide en petit, les pattes courtes paraissent plus ramassées.'],
  [92,'D. Trait 92','Très gras : vide ~10, les moitiés se touchent presque — maximum de densité, mais la coupure disparaît en 16 px.'],
];
const u = (id, s, w) => `<svg width="${s}" height="${s}" style="--w:${w}"><use href="#${id}"/></svg>`;
document.getElementById('g1').innerHTML = L.map(([w, t, d]) => `<div class="card"><b>${t}</b><p>${d}</p>
  <div class="tag">Bicolore</div>
  <div class="row"><div class="d">${u('bi',128,w)}</div><div class="l">${u('bi',128,w)}</div></div>
  <div class="row"><div class="d">${u('bi',48,w)}</div><div class="d">${u('bi',32,w)}</div><div class="d">${u('bi',16,w)}</div>
  <div class="l">${u('bi',48,w)}</div><div class="l">${u('bi',32,w)}</div><div class="l">${u('bi',16,w)}</div></div>
  <div class="tag">Monochrome (badge mobile, une seule couleur)</div>
  <div class="row"><div class="d">${u('mo',128,w)}</div><div class="l">${u('mo',128,w)}</div></div>
  <div class="row"><div class="d">${u('mo',48,w)}</div><div class="d">${u('mo',32,w)}</div><div class="d">${u('mo',16,w)}</div>
  <div class="l">${u('mo',48,w)}</div><div class="l">${u('mo',32,w)}</div><div class="l">${u('mo',16,w)}</div></div></div>`).join('');
</script>
