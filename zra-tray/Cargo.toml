[package]
name = "zra-tray"
version = "0.6.0-dev"
edition = "2021"
description = "ZRA — tray natif et superviseur (modes poste et relais), voir reference/conception-zra-tray.md"
license = "MIT"
publish = false

[dependencies]
tao = "0.37"
tray-icon = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
arboard = "3"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
open = "5"
fd-lock = "4"
ctrlc = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
# Updates (5.4) : extraction de l'archive « app » téléchargée.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Globalization", "Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
# killpg (arrêt du groupe de processus) et prctl PDEATHSIG (pas d'orphelin).
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1