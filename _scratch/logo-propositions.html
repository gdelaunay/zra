<!doctype html><meta charset="utf-8"><title>ZRA — propositions</title>
<style>
body{margin:0;padding:32px;font:14px system-ui;background:#1d2021;color:#ebdbb2}
h2{font-weight:500;margin:32px 0 12px;color:#a89984}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:#282828;border-radius:12px;padding:16px}
.card b{display:block;margin-bottom:4px}.card p{color:#a89984;margin:4px 0 0;line-height:1.4}
.row{display:flex;gap:12px;align-items:end;margin-top:12px}
.d,.l{border-radius:8px;display:flex;align-items:center;justify-content:center;padding:8px}
.d{background:#1d2021;--n:#ebdbb2;--a:#b8bb26;--bg:#1d2021}
.l{background:#fbf1c7;--n:#282828;--a:#98971a;--bg:#fbf1c7}
svg{display:block}
</style>
<svg width="0" height="0" style="position:absolute"><defs>
<!-- Références retenues -->
<mask id="r0" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><circle cx="256" cy="256" r="150" fill="#fff"/><path d="M60 206 H306 L206 306 H452" fill="none" stroke="#000" stroke-width="30" stroke-linejoin="round"/></mask>
<mask id="r1" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect x="110" y="110" width="292" height="292" rx="96" fill="#fff"/><path d="M60 206 H306 L206 306 H452" fill="none" stroke="#000" stroke-width="26" stroke-linejoin="round"/></mask>
<symbol id="ref-d" viewBox="0 0 512 512"><g mask="url(#r0)"><path fill="var(--n)" d="M0 0 H512 V306 H206 L306 206 H0 Z"/><path fill="var(--a)" d="M0 206 H306 L206 306 H512 V512 H0 Z"/></g></symbol>
<symbol id="ref-s" viewBox="0 0 512 512"><g mask="url(#r1)"><path fill="var(--n)" d="M0 0 H512 V306 H206 L306 206 H0 Z"/><path fill="var(--a)" d="M0 206 H306 L206 306 H512 V512 H0 Z"/></g></symbol>
<symbol id="ref-t" viewBox="0 0 512 512"><g fill="none" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"><path stroke="var(--n)" d="M136 300 V136 H376 L290 222"/><path stroke="var(--a)" d="M376 212 V376 H136 L222 290"/></g></symbol>

<!-- A. Disque, fente 26 -->
<mask id="ma" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><circle cx="256" cy="256" r="150" fill="#fff"/><path d="M60 206 H306 L206 306 H452" fill="none" stroke="#000" stroke-width="26" stroke-linejoin="round"/></mask>
<symbol id="pa" viewBox="0 0 512 512"><g mask="url(#ma)"><path fill="var(--n)" d="M0 0 H512 V306 H206 L306 206 H0 Z"/><path fill="var(--a)" d="M0 206 H306 L206 306 H512 V512 H0 Z"/></g></symbol>
<!-- B. Disque, fente profonde 30 -->
<mask id="mb" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><circle cx="256" cy="256" r="150" fill="#fff"/><path d="M60 176 H336 L176 336 H452" fill="none" stroke="#000" stroke-width="30" stroke-linejoin="round"/></mask>
<symbol id="pb" viewBox="0 0 512 512"><g mask="url(#mb)"><path fill="var(--n)" d="M0 0 H512 V336 H176 L336 176 H0 Z"/><path fill="var(--a)" d="M0 176 H336 L176 336 H512 V512 H0 Z"/></g></symbol>
<!-- C. Disque, fente 34 -->
<mask id="mc" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><circle cx="256" cy="256" r="150" fill="#fff"/><path d="M60 206 H306 L206 306 H452" fill="none" stroke="#000" stroke-width="34" stroke-linejoin="round"/></mask>
<symbol id="pc" viewBox="0 0 512 512"><g mask="url(#mc)"><path fill="var(--n)" d="M0 0 H512 V306 H206 L306 206 H0 Z"/><path fill="var(--a)" d="M0 206 H306 L206 306 H512 V512 H0 Z"/></g></symbol>
<!-- D. Squircle, fente 30 -->
<mask id="md" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect x="110" y="110" width="292" height="292" rx="96" fill="#fff"/><path d="M60 206 H306 L206 306 H452" fill="none" stroke="#000" stroke-width="30" stroke-linejoin="round"/></mask>
<symbol id="pd" viewBox="0 0 512 512"><g mask="url(#md)"><path fill="var(--n)" d="M0 0 H512 V306 H206 L306 206 H0 Z"/><path fill="var(--a)" d="M0 206 H306 L206 306 H512 V512 H0 Z"/></g></symbol>
<!-- E. Squircle très arrondi, fente 26 -->
<mask id="me" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect x="110" y="110" width="292" height="292" rx="124" fill="#fff"/><path d="M60 206 H306 L206 306 H452" fill="none" stroke="#000" stroke-width="26" stroke-linejoin="round"/></mask>
<symbol id="pe" viewBox="0 0 512 512"><g mask="url(#me)"><path fill="var(--n)" d="M0 0 H512 V306 H206 L306 206 H0 Z"/><path fill="var(--a)" d="M0 206 H306 L206 306 H512 V512 H0 Z"/></g></symbol>

<symbol id="pf" viewBox="0 0 512 512"><g fill="none" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"><path stroke="var(--n)" d="M136 250 V136 H376 L281 231"/><path stroke="var(--a)" d="M376 262 V376 H136 L231 281"/></g></symbol>
<!-- G. Triangles compacts : pattes 80, trait 44, écart ~21 -->
<symbol id="pg" viewBox="0 0 512 512"><g fill="none" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path stroke="var(--n)" d="M136 216 V136 H376 L279 233"/><path stroke="var(--a)" d="M376 296 V376 H136 L233 279"/></g></symbol>
<!-- H. Triangles optique : diagonale plus fine -->
<symbol id="ph" viewBox="0 0 512 512"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="var(--n)" stroke-width="42" d="M136 250 V136 H376"/><path stroke="var(--n)" stroke-width="34" d="M376 136 L281 231"/><path stroke="var(--a)" stroke-width="42" d="M376 262 V376 H136"/><path stroke="var(--a)" stroke-width="34" d="M136 376 L231 281"/></g></symbol>
</defs></svg>

<h2>Références (retenues)</h2><div class="grid" id="g0"></div>
<h2>Propositions</h2><div class="grid" id="g1"></div>
<script>
const L = {
  g0: [
    ['ref-d','Disque fendu','fente 30 (référence)'],
    ['ref-s','Squircle fendu','fente 26 (référence)'],
    ['ref-t','4. Deux triangles','original : pattes longues, écart large (référence)'],
  ],
  g1: [
    ['pa','A. Disque, fente 26','La fente du disque resserrée de 30 à 26 : les deux moitiés s’emboîtent plus, le Z reste lisible et l’objet paraît plus dense.'],
    ['pb','B. Disque, fente profonde','Fente 30 mais diagonale plus longue et paliers plus courts (géométrie de l’ancienne E) : le Z est plus franc, les moitiés plus imbriquées, presque un S.'],
    ['pc','C. Disque, fente 34','À l’inverse, fente élargie à 34 : la coupure reste nette en 16 px et le Z se lit immédiatement, au prix d’un objet un peu moins « plein ».'],
    ['pd','D. Squircle, fente 30','Le squircle retenu mais avec la fente 30 du disque (au lieu de 26) : même caractère que la référence, cohérent si les deux formes cohabitent.'],
    ['pe','E. Squircle doux, fente 26','Coins plus arrondis (rx 124) et fente 26 : à mi-chemin entre le disque et le squircle, plus doux, presque un coussin.'],
    ['pf','F. Triangles corrigés','Pattes raccourcies (164 → 114) et écart entre les deux moitiés réduit (~58 → ~33 px de vide) : même esprit que le 4, plus ramassé, le Z se lit mieux.'],
    ['pg','G. Triangles compacts','Poussé plus loin : pattes courtes (80), trait plus gras (44) et écart réduit à ~21. Dense et solide en petit, le cadre Zed est toujours là mais plus discret.'],
    ['ph','H. Triangles optique','Mêmes proportions que F, mais la diagonale est plus fine que les barres et montants (34 contre 42) : correction optique, le Z paraît homogène, comme une vraie lettre.'],
  ],
};
const u = (id, s) => `<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`;
for (const [g, items] of Object.entries(L))
  document.getElementById(g).innerHTML = items.map(([id, t, d]) => `<div class="card"><b>${t}</b><p>${d}</p>
    <div class="row"><div class="d">${u(id,128)}</div><div class="l">${u(id,128)}</div></div>
    <div class="row"><div class="d">${u(id,48)}</div><div class="d">${u(id,32)}</div><div class="d">${u(id,16)}</div>
    <div class="l">${u(id,48)}</div><div class="l">${u(id,32)}</div><div class="l">${u(id,16)}</div></div></div>`).join('');
</script>
